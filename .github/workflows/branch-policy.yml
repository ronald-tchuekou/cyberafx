name: Branch policy

# Seule la branche `dev` (même dépôt) peut être fusionnée dans `main`.
# Ce contrôle est marqué "required" sur main via la protection de branche.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  only-dev-into-main:
    name: Only dev can merge into main
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$THIS_REPO" ] || [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Only the 'dev' branch can be merged into 'main' (got '$HEAD_REPO:$HEAD_REF'). Open your PR against 'dev' instead."
            exit 1
          fi
          echo "OK: dev -> main"
